name: Helio Gastro - data QA
on:
  push:
    branches:
      - feature/fr-integration-qa-20261027
  workflow_dispatch:
jobs:
  catalog-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalog (read only)
        run: |
          node scripts/audit-data.mjs
          node scripts/inspect-schema.mjs
          node scripts/audit-exploratory.mjs
          node scripts/audit-french-coverage.mjs
          node scripts/inspect-next-fr-restaurant.mjs
          node scripts/build-french-plan.mjs
          node scripts/list-french-section-titles.mjs
          node scripts/inspect-fr-heading-context.mjs
          node scripts/test-fr-section-render.mjs
          node scripts/audit-french-integrity.mjs
          node scripts/preview-french-batch.mjs
          node scripts/validate-french-batch.mjs
          node scripts/test-fr-batch-inventory.mjs
          node scripts/print-fr-batch-002-source.mjs
          node scripts/print-fr-remaining-source.mjs
          node scripts/test-fr-overlay-integrity.mjs
          node scripts/test-fr-pilot-page.mjs

      - name: Show next French translation target in job summary
        if: success()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('node:fs');
          const report=JSON.parse(fs.readFileSync('qa-reports/fr-next-restaurant.json','utf8'));
          const next=report.next;
          console.log('## Próximo restaurante pendiente de francés');
          if(next){
            console.log('**'+next.name+'** ('+next.id+') — '+next.pendingCount+' descripciones pendientes de '+next.count+'.');
            console.log('### Próximas 12 descripciones ES/EN para traducir');
            console.log('| Índice | Plato | Español | Inglés |');
            console.log('|---|---|---|---|');
            for(const item of next.entries.slice(0,12)){
              const safe=v=>String(v??'').replaceAll('|','&#124;').replace(/\s+/g,' ').trim();
              console.log('| '+item.sectionIndex+':'+item.itemIndex+' | '+safe(item.name)+' | '+safe(item.es)+' | '+safe(item.en)+' |');
            }
            console.log('Fuente: catálogo y lotes reales de la rama QA. Traducciones todavía sin preparar.');
          }else console.log('No quedan descripciones ES/EN sin lote FR según este inventario.');
          console.log('El detalle original está en el artefacto french-coverage-proposals.');
          NODE

      - name: Upload French proposals (not applied to catalog)
        uses: actions/upload-artifact@v4
        with:
          name: french-coverage-proposals
          path: |
            qa-reports/fr-coverage-proposals.json
            qa-reports/fr-next-restaurant.json
          retention-days: 14

  visual-qa:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Start static server and run desktop/mobile browser QA
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/helio-qa-server.log 2>&1 &
          python3 - <<'PY'
          import time,urllib.request
          for i in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/qa-fr-la-montillana.html',timeout=2)
                  break
              except Exception: time.sleep(1)
          else: raise SystemExit('QA web server unavailable')
          PY
          status=0
          for suite in \
            scripts/test-fr-search-ui-pilot.mjs \
            scripts/test-fr-filter-ui-pilot.mjs \
            scripts/test-fr-results-ui-pilot.mjs \
            scripts/test-fr-visual.mjs \
            scripts/test-fr-real-detail-27.mjs \
            scripts/test-fr-bar-marta-17.mjs \
            scripts/test-fr-la-jineta-22.mjs \
            scripts/test-fr-la-tarterie-28.mjs \
            scripts/test-fr-el-abuelo-31.mjs \
            scripts/test-fr-la-viuda-34.mjs \
            scripts/test-fr-casa-rubio-36.mjs \
            scripts/test-fr-el-numero-10-37.mjs \
            scripts/test-fr-la-taberna-del-rio-38.mjs \
            scripts/test-fr-rafae-38.mjs \
            scripts/test-fr-don-pepe-centro-43.mjs \
            scripts/test-fr-el-poema-alonso-44.mjs \
            scripts/test-fr-dtapas-covap-45.mjs \
            scripts/test-fr-plateros-san-francisco-46.mjs \
            scripts/test-fr-taberna-salinas-56.mjs \
            scripts/test-fr-taberna-la-sal-60.mjs \
            scripts/test-fr-el-pisto-62.mjs \
            scripts/test-fr-rincon-beatillas-75.mjs \
            scripts/test-fr-la-bandera-84.mjs \
            scripts/test-fr-la-cazuela-89.mjs \
            scripts/test-fr-don-pepe-ciudad-jardin-12.mjs \
            scripts/test-fr-moriles-ribera-12.mjs \
            scripts/test-search-regression.mjs \
            scripts/test-filter-regression.mjs \
            scripts/test-comparator-regression.mjs \
            scripts/test-detail-regression.mjs \
            scripts/test-navigation-regression.mjs; do
            echo "::group::Running $suite"
            node "$suite" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Upload visual QA screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fr-visual-qa-desktop-mobile
          path: qa-reports/
          retention-days: 14
