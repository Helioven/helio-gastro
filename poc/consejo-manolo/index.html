<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>El Consejo de Manolo · Helio Gastro</title>
<style>
* { box-sizing: border-box; }
body { margin:0; color:#f5f5f4; background:#091a2d; font:16px/1.55 system-ui,sans-serif; }
.shell { max-width:1140px; margin:auto; padding:clamp(16px,4vw,48px); }
header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.brand { font-weight:750; } .brand span { color:#ffc857; }
select { font:inherit; min-height:44px; background:#0b2545; color:#f5f5f4; border:1px solid #8eacc6; border-radius:8px; padding:5px 8px; }
:focus-visible { outline:3px solid #ffc857; outline-offset:3px; }
.intro { display:flex; align-items:center; gap:12px; margin:24px 0 18px; }
.intro img { width:clamp(96px,12vw,124px); height:auto; object-fit:contain; flex:none; }
h1,h2,h3,p { margin:0; } h1 { font-size:clamp(24px,4vw,44px); line-height:1.1; }
.intro p, .meta, footer { color:#c4d7e8; }
.warning { color:#0b2545; background:#ffc857; border-radius:8px; padding:8px 12px; font-weight:800; margin-bottom:18px; }
.cases { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
article { background:#0b2545; border:1px solid #557994; border-radius:14px; padding:18px; overflow-wrap:anywhere; }
h2 { font-size:1.24rem; line-height:1.25; margin-bottom:8px; }
.state { color:#ffc857; font-size:.83rem; font-weight:700; margin-bottom:5px; }
.meta { margin:10px 0 14px; font-size:.85rem; }
h3 { font-size:.92rem; margin-top:12px; }
ul { padding-inline-start:20px; margin:4px 0 0; }
.advice,.empty { border-left:3px solid #ffc857; padding:8px 10px; background:#163553; border-radius:5px; margin-top:12px; }
.advice h3 { margin-top:0; }
footer { margin-top:18px; font-size:.88rem; }
@media(max-width:780px){ .cases { grid-template-columns:1fr; } }
</style>
<script defer src="fixtures.js"></script>
<script defer src="preview.js"></script>
</head>
<body><main class="shell">
<header><div class="brand">Helio Gastro <span>· ManoloLabs by Helio</span></div><div><label id="language-label" for="language">Idioma</label> <select id="language"><option value="es" lang="es">Español</option><option value="en" lang="en">English</option><option value="fr" lang="fr">Français</option></select></div></header>
<div class="intro"><img src="manolo-chef.webp" id="manolo-chef" width="384" height="384" alt="Manolo Chef con gorro blanco, dos antenas y delantal oscuro"><div><h1 id="title">El Consejo de Manolo</h1><p id="subtitle"></p></div></div>
<p class="warning" id="warning">DATOS FICTICIOS — SOLO PROTOTIPO</p>
<section class="cases" id="cases" aria-label="Casos ficticios"></section>
<footer id="footer"></footer>
</main></body>
</html>
